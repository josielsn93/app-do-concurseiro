name: Publicar app no GitHub Pages

# Publica a pasta src/ (o app) em https://<usuario>.github.io/<repositorio>/.
# Requer, uma vez: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Tambem roda depois do "Auto cache bump", porque commits feitos com o GITHUB_TOKEN
# nao disparam outros workflows e a versao com cache incrementado precisa ser publicada.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Auto cache bump']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload app (src/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: src

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
